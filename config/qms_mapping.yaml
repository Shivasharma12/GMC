# GMC Extractor - QMS Field Mapping
# Maps internal field paths (dot-notation) -> QMS field names and display labels.
# Used by export/qms_mapper.py to generate flat QMS JSON + CSV.
# Format:
#   <internal_path>:
#     qms_field: QMS_FIELD_CODE
#     label: "Human-readable label"
#     type: amount | percent | days | text | boolean | date | list

# ── Identity ──────────────────────────────────────────────────────────────────
identity.insurer_name:
  qms_field: IDENT_INSURER
  label: "Insurer Name"
  type: text

identity.tpa_name:
  qms_field: IDENT_TPA
  label: "TPA Name"
  type: text

